<!DOCTYPE html>
<!-- Streamlit custom component: hosts the shared 3D scene (scene.js).
     The iframe is created ONCE; every simulation step arrives as new args via
     postMessage, so the 3D scene keeps running instead of reloading each step. -->
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #0b1026; overflow: hidden; }
    #twin { width: 100%; height: 560px; }
  </style>
  <!-- Three.js r128 is bundled locally so the twin also works without internet -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="assets/models.js"></script>
  <script src="scene.js"></script>
</head>
<body>
  <div id="twin"></div>
  <script>
    // Minimal Streamlit component protocol (no build step / npm needed)
    function sendToStreamlit(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), '*');
    }

    const twin = createTwinScene(document.getElementById('twin'));
    let height = 560;

    window.addEventListener('message', function (event) {
      if (!event.data || event.data.type !== 'streamlit:render') return;
      const args = event.data.args || {};
      if (args.height && args.height !== height) {
        height = args.height;
        document.getElementById('twin').style.height = height + 'px';
      }
      if (args.record) twin.update(args.record, args.interval_ms || 1500);
      sendToStreamlit('streamlit:setFrameHeight', { height: height });
    });

    sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });
    sendToStreamlit('streamlit:setFrameHeight', { height: height });
  </script>
</body>
</html>
